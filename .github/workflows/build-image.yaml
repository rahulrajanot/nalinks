name: Build and publish NA Portal

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/rahulrajanot/nalinks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image tag
        id: vars
        shell: bash
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update Kubernetes image tag
        shell: bash
        run: |
          sed -i "s|image: ghcr.io/rahulrajanot/nalinks:.*|image: ghcr.io/rahulrajanot/nalinks:${{ steps.vars.outputs.image_tag }}|" k8s/deployment.yaml

      - name: Commit deployment manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if git diff --cached --quiet; then
            echo "No manifest update required"
            exit 0
          fi
          git commit -m "Deploy NA Portal image ${{ steps.vars.outputs.image_tag }}"
          git push origin main
