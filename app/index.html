<!DOCTYPE html><html><head><title>NA Portal</title><style>body{font-family:Arial;margin:40px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:8px}th{background:#f2f2f2}</style></head><body><h1>NA Environment Portal</h1><table><thead><tr><th>Name</th><th>Platform</th><th>Link</th></tr></thead><tbody id="t"></tbody></table><script>fetch('versions.json').then(r=>r.json()).then(d=>{let h='';d.forEach(x=>h+=`<tr><td>${x.name}</td><td>${x.platform}</td><td><a href="${x.url}" target="_blank">Open</a></td></tr>`);document.getElementById('t').innerHTML=h;});</script></body></html>
