apiVersion: apps/v1
kind: Deployment
metadata:
  name: na-portal
  namespace: naportal
  labels:
    app: na-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: na-portal
  template:
    metadata:
      labels:
        app: na-portal
    spec:
      containers:
        - name: na-portal
          image: ghcr.io/rahulrajanot/nalinks:f146891
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
