apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: na-portal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rahulrajanot/nalinks.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: naportal
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
